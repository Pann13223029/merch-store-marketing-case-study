name: tests

on:
  push:
  pull_request:

# least privilege: the job only reads the repository
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # data/ is gitignored, so the real-data checks skip here and only the synthetic suite runs
      - run: python -m pytest
